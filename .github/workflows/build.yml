name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # main への push は TestFlight 内部テスト向け（docs/DesignDoc.md §7.2）
      - name: Build preview
        if: startsWith(github.ref, 'refs/heads/')
        run: eas build --platform ios --profile preview --non-interactive --no-wait

      # タグ v* は production + submit
      - name: Build production
        if: startsWith(github.ref, 'refs/tags/v')
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
